[project]
name = "inotex-logo-checking"
version = "0.1.0"
description = "Defect checks for transparent heat-transfer labels"
readme = "README.md"
authors = [
    { name = "ducduy9304", email = "ducduy9304@gmail.com" }
]
requires-python = "==3.11.*"
dependencies = [
    "anomalib>=2.7.0",
    "pyside6>=6.11.3,<6.12",  # 6.12.0: QLabel.setText/setPixmap decref None, crashes the live view after a few minutes
]


[tool.uv]
# anomalib pulls the CPU-only pip OpenCV, which shadows the CUDA build linked by link_opencv_cuda.sh.
override-dependencies = ["opencv-python-headless; sys_platform == 'never'"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
]
